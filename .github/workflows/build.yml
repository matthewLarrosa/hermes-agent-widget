name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apple-platforms:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test shared core
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build macOS app and widget
        run: >-
          xcodebuild -project HermesAgentWidget.xcodeproj
          -scheme HermesMac
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS app and widget
        run: >-
          xcodebuild -project HermesAgentWidget.xcodeproj
          -scheme HermesIOS
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
